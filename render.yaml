# Render blueprint. The harvester is the production server: it serves the app,
# the data it built at deploy time, and the one proxy route the browser needs
# because nemweb.com.au sends no CORS headers.
#
# The plan is Standard because the backfill parses AEMO daily files that
# decompress to ~120 MB of text; the 512 MB free tier runs out of memory
# mid-build. Data lives on ephemeral disk and is rebuilt each deploy, which is
# the point — every deploy ships fresh market data.
services:
  - type: web
    name: gridsense
    runtime: node
    plan: standard
    # The pipeline itself lives in package.json, not here. A service created by
    # hand keeps whatever build command it was given and never re-reads this
    # file, so naming the steps here means every new backfill stage has to be
    # pasted into the dashboard by hand — and the stage that gets forgotten
    # shows up as one panel silently 404ing. One indirection fixes that for good.
    buildCommand: npm install && npm run build:data
    startCommand: node harvester/serve.js
    healthCheckPath: /
    envVars:
      # The dispatch parse holds a ~120 MB CSV and its row objects at once, and
      # Node's default old-space cap on a 2 GB container sits near 1 GB, which
      # is closer to that peak than a build should run.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
